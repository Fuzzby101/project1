<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IXL | Dashboard</title>
<link rel="stylesheet" href="config/main.css" />
<script src="config/main.js" type="module"></script>
<!-- Custom style block to fix the spacing gap -->
<style>
  #title {
    margin-bottom: 2px;
  }
  #title img {
    display: block;
    margin: 0 auto;
  }
  #subtitle {
    margin-top: 0;
    margin-bottom: 15px;
  }
</style>
  </head>
 <!-- Paste this whole block right before </body> in index.html (and any other page you want it on). -->
<style>
html,body{background:transparent!important}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#12142a url('background.gif') center/cover no-repeat}
</style><style>
#xpbar{position:fixed;top:12px;right:12px;z-index:50;font:14px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;
  --s:#fff;--ink:#161a2e;--mu:#6a7090;--ln:#dde0ec;--ac:#2f4bff;--acink:#fff;--xp:#ffb400;--bg:#eef0f6}
@media(prefers-color-scheme:dark){#xpbar{--s:#1b1e3a;--ink:#eef0ff;--mu:#9298c0;--ln:#2c3055;--ac:#7c8dff;--acink:#10132c;--bg:#12142a}}
#xpbtn{display:flex;align-items:center;gap:8px;background:var(--s);color:var(--ink);border:1px solid var(--ln);
  border-radius:99px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;max-width:200px}
#xpbtn:hover{border-color:var(--ac)}
#xpbtn:focus-visible,#xpmenu a:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
#xpLvl{background:var(--ac);color:var(--acink);border-radius:99px;min-width:28px;height:28px;display:grid;place-items:center;font-weight:700;padding:0 6px}
#xpName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#xpmenu{position:absolute;right:0;top:calc(100% + 8px);width:240px;background:var(--s);color:var(--ink);
  border:1px solid var(--ln);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
#xpmenu[hidden]{display:none}
#xpmenu strong{display:block;font-size:1rem;overflow:hidden;text-overflow:ellipsis}
#xpmenu .mu{color:var(--mu);font-size:.85rem}
#xpmenu .bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 4px}
#xpmenu .bar i{display:block;height:100%;width:0;background:var(--xp);border-radius:99px}
#xpmenu a{display:block;text-align:center;margin-top:10px;padding:8px;border-radius:8px;border:1px solid var(--ln);color:var(--ink);text-decoration:none;font-weight:600}
#xpmenu a.p{background:var(--ac);color:var(--acink);border-color:var(--ac)}
</style>

<div id="xpbar">
  <button id="xpbtn" aria-haspopup="true" aria-expanded="false" aria-controls="xpmenu">
    <span id="xpLvl">?</span><span id="xpName">Log in</span>
  </button>
  <div id="xpmenu" hidden>
    <strong id="mName">Not on the board yet</strong>
    <span class="mu" id="mSub">Play a game to earn XP and get a rank.</span>
    <div class="bar"><i id="mFill"></i></div>
    <span class="mu" id="mXp"></span>
    <a class="p" id="mLb" href="/project1/games-xp.html">Leaderboard</a>
    <a id="mPlay" href="/project1/games-xp.html">Play games</a>
  </div>
</div>

<script>
(function(){
  var KEY = 'gamehub-v1';   // same key the leaderboard page saves to
  var $ = function(id){ return document.getElementById(id); };
  var xpFor = function(n){ return 50 * n * (n - 1); };
  var lvlOf = function(xp){ return Math.floor((1 + Math.sqrt(1 + xp / 12.5)) / 2); };

  function paint(){
    var me = {};
    try { me = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
    if (!me.id){ $('xpLvl').textContent = '?'; $('xpName').textContent = 'Log in'; $('mName').textContent = 'Not logged in'; $('mSub').textContent = 'Log in or sign up to earn XP and get on the leaderboard.'; $('mFill').style.width = '0%'; $('mXp').textContent = ''; return; }
    var total = me.total || 0, lvl = lvlOf(total), lo = xpFor(lvl), hi = xpFor(lvl + 1);
    $('xpLvl').textContent = lvl;
    $('xpName').textContent = me.name || 'Player';
    $('mName').textContent = me.name || 'Player';
    $('mSub').textContent = 'Level ' + lvl + (me.streak ? ' · ' + me.streak + '-day streak' : '');
    $('mFill').style.width = Math.round((total - lo) / (hi - lo) * 100) + '%';
    $('mXp').textContent = (total - lo) + ' / ' + (hi - lo) + ' XP to level ' + (lvl + 1);
  }
  function toggle(open){
    $('xpmenu').hidden = !open;
    $('xpbtn').setAttribute('aria-expanded', open);
    if (open) paint();
  }
  $('xpbtn').onclick = function(e){ e.stopPropagation(); toggle($('xpmenu').hidden); };
  document.addEventListener('click', function(e){ if (!$('xpbar').contains(e.target)) toggle(false); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') toggle(false); });
  window.addEventListener('storage', paint);   // updates if XP changes in another tab
  paint();
})();
</script>
 <body>
    <div class="center">
      <h1 id="title">
        <img
          src="cyanide.png"
          alt="cyanide"
          style="max-width: 400px; width: 100%; height: auto;"
        />
      </h1>
  <p id="subtitle">v1</p>
</div>
<div class="center">
  <input type="text" id="searchInput" placeholder="Search games" />
</div>
<div id="gamesContainer"></div>
<div class="footer">
  <a style="font-weight: 700">a site by </a>
  <a
    style="font-weight: 700"
    class="link"
    href="https://dsc.gg"
  >parcoil network</a>
</div>
  </body>
</html>
